<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Gotchapon Overlay</title>
	<style>
		@font-face {
			font-family: qilka;
			src: url("Qilka-Bold.ttf");
		}

		body {
			display: flex;
			flex-direction: column;
			height: 100vh;
			width: 100%;
			margin: 0;
			overflow: hidden;
			font-family: qilka;
			background: #111;
			color: #eee;
		}

		img {
			transition: opacity 3.3s ease;
		}

		.hidden {
			opacity: 0;
		}

		.visible {
			opacity: 1;
		}

		#stage {
			position: relative;
			flex: 1 1 auto;
			min-height: 0;
			overflow: hidden;
		}

		#background {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		#rewardImage {
			position: absolute;
			bottom: 6%;
			left: 50%;
			transform: translateX(-50%);
			width: 32%;
			max-width: 320px;
		}

		#userName {
			position: absolute;
			bottom: 20%;
			left: 50%;
			transform: translateX(-50%);
			text-align: center;
			white-space: nowrap;
			font-size: clamp(14px, 2.5vw, 40px);
			color: black;
			transition: opacity 3.3s ease;
		}

		#rewardHistoryBody {
			flex: 0 0 auto;
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			align-items: center;
			gap: 8px;
			padding: 12px 16px;
			transition: opacity 3.3s ease;
		}

		.historyTileWrapper {
			position: relative;
			width: 72px;
			height: 72px;
		}

		.historyTile {
			width: 100%;
			height: 100%;
			object-fit: cover;
			border-radius: 6px;
		}

		.counter {
			position: absolute;
			bottom: 2px;
			right: 2px;
			background: rgba(0, 0, 0, 0.7);
			color: #fff;
			font-size: 12px;
			padding: 1px 5px;
			border-radius: 8px;
		}
	</style>
	<script type="module" src="./script.js"></script>
</head>

<body>
	<div id="stage">
		<img src="./background.jpg" id="background" class="hidden">
		<img id="rewardImage" class="hidden">
		<a id="userName" class="hidden"></a>
	</div>
	<div id="rewardHistoryBody" class="hidden"></div>
</body>

</html>
